apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: {{ .Values.cluster.name }}-workers
spec:
  template:
    spec:
      {{- if and (not .Values.cloudInit.mounts) (not .Values.workers.mounts) }}
      mounts: []
      {{- else }}
      mounts:
      {{- with .Values.cloudInit.mounts }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.mounts }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      
      {{- if and (not .Values.cloudInit.diskSetup) (not .Values.workers.diskSetup) }}
      diskSetup: {}
      {{- else }}
      diskSetup:
      {{- with .Values.cloudInit.diskSetup }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.diskSetup }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

      {{- if and (not .Values.cloudInit.users) (not .Values.workers.users) }}
      users: []
      {{- else }}
      users:
      {{- with .Values.cloudInit.users }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workers.users }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: metal3.io/uuid={{`{{ ds.meta_data.uuid }}`}}
          name: {{`'{{ ds.meta_data.name }}'`}}
