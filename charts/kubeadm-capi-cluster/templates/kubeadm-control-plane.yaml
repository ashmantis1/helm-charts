apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: {{ .Values.cluster.name }}
spec:
  kubeadmConfigSpec:
    initConfiguration:
      {{- if .Values.controlPlane.skipKubeProxy }}
      skipPhases:
        - addon/kube-proxy
      {{- end }}
      nodeRegistration:
        {{- if .Values.controlPlane.schedulable }}
        taints: []
        {{- end }}
        kubeletExtraArgs:
          node-labels: metal3.io/uuid={{`{{ ds.meta_data.uuid }}`}}
        name: {{`'{{ ds.meta_data.name }}'`}}
    joinConfiguration:
      controlPlane: {}
      nodeRegistration:
        {{- if .Values.controlPlane.schedulable }}
        taints: []
        {{- end }}
        kubeletExtraArgs:
          node-labels: metal3.io/uuid={{`{{ ds.meta_data.uuid }}`}}
        name: {{`'{{ ds.meta_data.name }}'`}}
    postKubeadmCommands:
      {{- if .Values.controlPlane.loadbalancer.kubevip.enabled }}
      - "sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml"
      {{- end }}
      {{- with .Values.controlPlane.postKubeadmCommands }}
      {{- . | toYaml | nindent 6 }}
      {{- end }}
    {{- if and (not .Values.cloudInit.mounts) (not .Values.controlPlane.mounts) }}
    mounts: []
    {{- else }}
    mounts:
    {{- with .Values.cloudInit.mounts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controlPlane.mounts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
    
    {{- if and (not .Values.cloudInit.diskSetup) (not .Values.controlPlane.diskSetup) }}
    diskSetup: {}
    {{- else }}
    diskSetup:
    {{- with .Values.cloudInit.diskSetup }}
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.controlPlane.diskSetup }}
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}

    {{- if and (not .Values.cloudInit.users) (not .Values.controlPlane.users) }}
    users: []
    {{- else }}
    users:
    {{- with .Values.cloudInit.users }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.controlPlane.users }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
    files: 
      {{- with .Values.controlPlane.files }}
      {{- . | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.controlPlane.loadbalancer.kubevip.enabled }}
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        content: | 
            apiVersion: v1
            kind: Pod
            metadata:
              creationTimestamp: null
              name: kube-vip
              namespace: kube-system
            spec:
              containers:
              - args:
                - manager
                env:
                - name: vip_arp
                  value: "true"
                - name: port
                  value: "{{ .Values.controlPlane.endpoint.port }}"
                - name: vip_interface
                  value: "{{ .Values.controlPlane.endpoint.interface }}"
                - name: vip_cidr
                  value: "32"
                - name: cp_enable
                  value: "true"
                - name: cp_namespace
                  value: kube-system
                - name: vip_ddns
                  value: "false"
                - name: svc_enable
                  value: "true"
                - name: vip_leaderelection
                  value: "true"
                - name: vip_leaseduration
                  value: "5"
                - name: vip_renewdeadline
                  value: "3"
                - name: vip_retryperiod
                  value: "1"
                - name: address
                  value: {{ .Values.controlPlane.endpoint.host }}
                image: {{ .Values.controlPlane.loadbalancer.kubevip.image.name }}:{{ .Values.controlPlane.loadbalancer.kubevip.image.tag }}
                imagePullPolicy: Always
                name: kube-vip
                resources: {}
                securityContext:
                  capabilities:
                    add:
                    - NET_ADMIN
                    - NET_RAW
                    - SYS_TIME
                volumeMounts:
                - mountPath: /etc/kubernetes/admin.conf
                  name: kubeconfig
              hostAliases:
              - hostnames:
                - kubernetes
                ip: 127.0.0.1
              hostNetwork: true
              volumes:
              - hostPath:
                  path: /etc/kubernetes/super-admin.conf
                name: kubeconfig
      {{ end }}
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: Metal3MachineTemplate
      name: {{ .Values.cluster.name }}-controlplane
    nodeDrainTimeout: 0s
  replicas: {{ .Values.controlPlane.replicas }} 
  rolloutStrategy:
    rollingUpdate:
      {{- if .Values.controlPlane.scaleIn }}
      maxSurge: 0
      {{- else }}
      maxSurge: {{ .Values.controlPlane.maxSurge }}
      {{- end }}
    type: RollingUpdate
  version: v{{ .Values.kubernetes.version | trimPrefix "v" }}
