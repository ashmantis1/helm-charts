{{- if .Values.proxmoxWorkers.enabled }}
{{- range $key, $node := .Values.proxmoxWorkers.nodes }}
{{- $specs := $.Values.proxmoxWorkers.templateSpecs | deepCopy -}}
{{- $override := $node.specsOverride -}}
{{- $merged := merge $override $specs  -}}
{{- $hash := $merged | toYaml | sha256sum | trunc 10 }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $.Values.cluster.name }}-proxmox-workers-{{ $node.name }}
spec:
  clusterName: {{ $.Values.cluster.name }}
  replicas: {{ $node.replicas }}
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $.Values.cluster.name }}
        node-role.kubernetes.io/node: ""
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $.Values.cluster.name }}-proxmox-worker
      clusterName: svc
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: {{ $.Values.cluster.name }}-proxmox-worker-{{ $node.name }}-{{ $.Values.kubernetes.version }}-{{ $hash }}
      version: {{ $.Values.kubernetes.version }}
---
{{- end }}
{{- end }}
